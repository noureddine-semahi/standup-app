<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StandUp — Offline</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:#0B0A12; color:#F2F0FA;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .icon{
    width:56px;height:56px;border-radius:16px;
    background:#14121F;border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  }
  h1{font-size:20px;margin:0 0 8px}
  p{color:rgba(242,240,250,.62);font-size:14px;max-width:280px;line-height:1.5;margin:0}
  button{
    margin-top:24px; background:#8B5CF6;color:#fff;border:none;
    border-radius:12px;padding:12px 24px;font-size:14px;font-weight:600;
  }
</style>
</head>
<body>
  <div class="icon">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22M9 3.35A9 9 0 0 1 21 12a9.06 9.06 0 0 1-.5 3M6.26 6.26A9 9 0 0 0 3 12a9 9 0 0 0 9 9c1.65 0 3.19-.51 4.46-1.38"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>StandUp needs a connection to load or save your goals. Reconnect and reopen the app.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
